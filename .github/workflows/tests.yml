name: tests

on:
  # A branch with a pull request would otherwise run the matrix twice per
  # push, once for each event.  master is tested on push, everything else
  # through its pull request, forks included.
  push:
    branches: [master]
  pull_request:

# A new push to the same branch supersedes the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # local: polysh talks to a local shell through tests/fake_ssh.sh
        # sshd: through ssh to a private sshd, see tests/with_sshd.sh
        transport: [local, sshd]
    name: ${{ matrix.transport }} / python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install sshd
        if: matrix.transport == 'sshd'
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: Run the tests against a local shell
        if: matrix.transport == 'local'
        run: uv run pytest -n auto

      - name: Run the tests through ssh
        if: matrix.transport == 'sshd'
        run: tests/with_sshd.sh uv run pytest -n auto
