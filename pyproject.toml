[project]
name = "polysh"
authors = [{ email = "it@innogames.com" }]
dynamic = ["version"]
description = "Control thousands of SSH sessions from a single prompt"
readme = "README.rst"
requires-python = ">=3.6"
dependencies = []
classifiers = [  # Optional
        "Intended Audience :: System Administrators",
        "Intended Audience :: Developers",
        "Topic :: System :: Systems Administration",
        "Topic :: System :: Shells",
        "Topic :: System :: Clustering",
        "Topic :: System :: Distributed Computing",

        "Environment :: Console",
        "Operating System :: POSIX :: Linux",
        "Operating System :: MacOS :: MacOS X",

        "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
        "Development Status :: 5 - Production/Stable",

        # This does not influence pip when choosing what to install. It is used
        # for the package list on the pypi website.
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.6",
        "Programming Language :: Python :: 3.7",
        "Programming Language :: Python :: 3.8",
        "Programming Language :: Python :: 3.9",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/innogames/polysh"
Documentation = "https://github.com/innogames/polysh"
Repository = "https://github.com/innogames/polysh"
Issues = "https://github.com/innogames/polysh/issues"
Changelog = "https://github.com/innogames/polysh/blob/master/CHANGELOG.rst"

[project.license]
file = "LICENSE"

[project.scripts]
polysh = "polysh.main:main"

[project.optional-dependencies]
logging = [
    "sentry-sdk>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/polysh/__init__.py"

[tool.hatch.build.targets.sdist]
include=[
    "src/**",
    "tests/**",
    "pyproject.toml",
    "README.rst",
    "CHANGELOG.rst",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polysh"]

[dependency-groups]
dev = [
    "pexpect>=4.9.0",
    "coverage>=7.10",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
]

[tool.uv.dependency-groups]
# pytest 8 needs Python 3.8, coverage 7.10 Python 3.9; polysh itself still
# declares 3.6, so the tools only have to resolve for the versions CI tests
dev = { requires-python = ">=3.9" }

[tool.coverage.run]
source = ["polysh"]
# The tests measure the polysh processes they spawn, not themselves: each
# process writes its own data file, "coverage combine" merges them.  The
# subprocess patch makes those processes record coverage, _exit saves the
# data of a process that leaves through os._exit()
parallel = true
patch = ["subprocess", "_exit"]
# The pytest process itself imports little of polysh, only the children do
disable_warnings = ["no-data-collected"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Safety net for a hung test: pexpect's own 30s expect() timeout fires first
# in an ordinary failure
timeout = 120
markers = [
    "slow: takes several seconds, deselect with -m 'not slow'",
]
